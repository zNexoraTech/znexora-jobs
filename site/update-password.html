<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><!-- REMOVE at public launch -->
<title>New password | ZNexora Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="wrap">
  <div class="card form-narrow">
    <h1 data-i18n="auth.new_password">New password</h1>
    <div id="msg"></div>
    <form id="pw-form">
      <label for="password" data-i18n="auth.new_password">New password</label>
      <input type="password" id="password" required minlength="10" autocomplete="new-password">
      <button type="submit" data-i18n="auth.update_password_btn">Save password</button>
    </form>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script type="module" src="/assets/js/pages/update-password.js"></script>
</body>
</html>
