# Deploys the Supabase Edge Functions whenever a file under supabase/functions changes
# (or when you click "Run workflow" on the Actions tab).
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   e.g. dslybmgvlhhkkguhnanb  (the part before .supabase.co)
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in Settings -> Secrets and variables -> Actions"
            exit 1
          fi
      - name: Deploy every function
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            [ -f "$dir/index.ts" ] || continue
            echo "Deploying $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
