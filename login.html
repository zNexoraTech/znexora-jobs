<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow"><!-- REMOVE at public launch -->
<title>Log in | ZNexora Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="wrap">
  <div class="card form-narrow">
    <h1 data-i18n="nav.login">Log in</h1>
    <div id="msg"></div>
    <form id="login-form">
      <label for="email" data-i18n="auth.email">Email</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="password" data-i18n="auth.password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <div id="captcha-box" class="u-my12"></div>
      <button type="submit" data-i18n="auth.login_btn">Log in</button>
    </form>
    <p class="meta"><button id="forgot" class="secondary small" type="button" data-i18n="auth.forgot">Forgot password?</button></p>
    <p class="meta"><span data-i18n="auth.no_account">No account yet?</span> <a href="signup.html" data-i18n="nav.signup">Sign up</a></p>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
